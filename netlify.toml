# Postavke za objavu na Netlifyju. Aplikacija je u korijenu repozitorija.
[build]
  command = "npm run build"
  publish = "dist"

# Jednostranicna aplikacija: svaka putanja ide na index.html, inace bi
# osvjezavanje na /kartica/123/ispis vratilo 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Servisni radnik se ne smije predmemorirati, inace nova verzija nikad ne
# stigne do uredjaja.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
